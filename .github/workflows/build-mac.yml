name: Build Mac Executable

# This allows you to manually trigger the build from the GitHub UI
on:
  workflow_dispatch: 

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Adjust to your Python version if needed

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask flask-cors pillow pyinstaller

    - name: Build with PyInstaller
      # Notice the colons (:) instead of semicolons (;) for Mac paths
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "templates:templates" --add-data "special_files:special_files" app.py

    - name: Zip the Mac App Bundle
      # Zipping the .app preserves the strict macOS file permissions
      run: |
        cd dist
        zip -r SCORM_Processor_Mac.zip app.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SCORM-Processor-Mac
        path: dist/SCORM_Processor_Mac.zip
