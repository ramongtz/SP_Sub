version: '3.8'

services:
  # Our Python Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scorm-backend
    volumes:
      - ./logs:/app/logs:Z
    # --- NEW: Provide environment variables to the container ---
    # env_file:
    #  - .env

    # This WILL read your .env file
    environment:
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - API_AUDIENCE=${API_AUDIENCE}
      # Add any other variables from your .env file here
      # - OTHER_VAR=${OTHER_VAR}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS}
      - PYTHON_VERSION=${PYTHON_VERSION}

      # --- TEMPORARY DIAGNOSTIC COMMAND ---
    # This will run INSTEAD of your app and print all
    # environment variables.
    #command: ["sh", "-c", "printenv"]
    # --- NEW TEST: Run Python directly ---
    command: ["python", "-c", "import os; print(f\"--- PYTHON SEES ---\nAUTH0_DOMAIN={os.environ.get('AUTH0_DOMAIN')}\nAPI_AUDIENCE={os.environ.get('API_AUDIENCE')}\n--- END ---\")"]

  # Our Nginx Frontend Service
  frontend:
    # --- MODIFIED: Build the frontend from our new Dockerfile ---
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: scorm-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend